mod.uaw.name = Unlimited Armament Works
mod.uaw.author = Eschatologue

# region Consumables
## Items

item.uaw-sulphur.name = Sulphur
item.uaw-sulphur.description = By-product of carbon processing. Can be combined with water to produce Sulphuric Acid.
item.uaw-sulphur.details = Often associated with the "brimstone" of ancient myth, its pungent aroma is a small price to pay for its industrial utility.

#item.uaw-actylite.name = Actylite
#item.uaw-actylite.description = A highly reactive inorganic material produced by calcining Spore Pods with Sulphur. Its active surface promotes reactions, phase transitions and separation of complex materials.
#item.uaw-actylite.details = Combining poorly understood anomalous nature of spores with the well-understood chemistry of sulphur has yielded many incomprehensible results.

item.uaw-anthracite.name = Anthracite
item.uaw-anthracite.description = Used for fuel and material synthesising. Can be found deep beneath coal veins.
item.uaw-anthracite.details = The highest rank of coal; it provides a significantly higher energy density than its softer counterparts.

item.uaw-tisic.name = TiSiC
item.uaw-tisic.description = A short for Titanium Silicon Carbide, an ultra-hard ceramic alloy. Used in constructions, fortifications, and armour-piercing munitions.
item.uaw-tisic.details = Bridging the gap between metal and ceramic, Titanium Silicon Carbide is almost as hard as diamond yet none of its brittleness, making it the ideal substrate for high-velocity kinetic tools.

item.uaw-stoutsteel.name = Stoutsteel
item.uaw-stoutsteel.description = A phase-tempered refractory alloy. Absorbs extreme kinetic shocks and can seal its own molecular fractures.
item.uaw-stoutsteel.details = Synthesised via exotic spatial weaving within a Phlogistic environment, this material bypasses traditional physical limitations. The phase lattice retains a permanent memory of its original form, guaranteeing structural immortality and thoroughly frustrating any demolition attempts.

item.uaw-ketonite.name = Ketonite
item.uaw-ketonite.description = High-density structural polymer. Utilised for construction.
item.uaw-ketonite.details = A semi-crystalline thermoplastic that boast immense structural and thermal resistance. Once a scarce commodity, it is now mass-produced and will (and did) outlast whoever the structure was built for.

item.uaw-cryo-solid.name = Cryothrate
item.uaw-cryo-solid.description = A synthetic cryogenic clathrate compound. Used as material synthesising and cryobaric munitions.
item.uaw-cryo-solid.details = Manufactured by crystallising refined petroleum compounds within a silica lattice under cryogenic conditions. The unstable structure stores hydrocarbons in a frozen metastable state. \nSudden collapse forces rapid phase transition, drawing thermal energy from surrounding materials. \n\nCold has finally learned industrial violence.

liquid.uaw-ref-oil.name = Refined Petroleum
liquid.uaw-ref-oil.description = A processed crude oil. Serves as a high-density combustible fuel and a primary reagent in advanced chemical synthesis.
liquid.uaw-ref-oil.details = Ancient civilisations routinely waged catastrophic wars over access to subterranean hydrocarbon reserves. Fractional distillation removes crude impurities to yield a versatile chemical foundation; which now fuels highly efficient catastrophic conflicts.

liquid.uaw-sulphuric-acid.name = Sulphuric Acid
liquid.uaw-sulphuric-acid.description = A highly corrosive mineral acid. Vital for complex chemical manufacturing.
liquid.uaw-sulphuric-acid.details = Once known as 'Oil of Vitriol', its discovery and eventual mass production heralded a new age of material engineering and industrial chemistry.

liquid.uaw-phlogiston.name = Phlogiston
liquid.uaw-phlogiston.description = Volatile, corrosive, and highly combustible gas, utilised for advanced power systems and material synthesis.
liquid.uaw-phlogiston.details = Named after a discarded theory of combustion, this engineered gas earned its name through enthusiasm for things that explode.

# endregion Consumables

# region Resourcing

block.uaw-hydro-thumper.name = Hydro Thumper
block.uaw-hydro-thumper.description = Injects high-pressure water deep beneath surface Coal veins, unearthing a highly potent Anthracite.\nMust be placed on Coal veins.
block.uaw-hydro-thumper.details = High-pressure water injection as a mining technique predates most of what surrounds it. The Hydro Thumper simply applies an old principle at a scale that would make its original engineers deeply uncomfortable.

# endregion Resourcing

# region Facilities

## region Production

# Production I

block.uaw-refiner-carbon.name = Calcinator
block.uaw-refiner-carbon.description = Performs high temperature and pressure of various carbon-based materials.
block.uaw-refiner-carbon.details = #n/a

block.uaw-refiner-oil.name = Petrochemical Refinery
block.uaw-refiner-oil.description = Cracks Oil or other materials into Refined Petroleum or other petroleum produce.
block.uaw-refiner-oil.details = Fractional distillation exploits the differing boiling points of complex hydrocarbons to isolate active chemical bases. These outputs form the primary backbone for plastic synthesis and synthetic compounds. \n\nThe automated pressure valves emit an acoustic pitch known to induce severe nausea.

block.uaw-mixer-chem.name = Chemical Synthesis Unit
block.uaw-mixer-chem.description = Catalytic reaction chamber. Combines various reagents to synthesise mineral acids or other useful compounds.
block.uaw-mixer-chem.details = Conventional chemical processing equipment adapted for continuous synthesis.

block.uaw-mixer-reactor.name = Reactor Crucible
block.uaw-mixer-reactor.description = Industrial reactor for conducting solid-, liquid-, and gas-phase chemical reactions under controlled conditions.
block.uaw-mixer-reactor.details = Reinforced reaction vessel for reactions that generally require more supervision than the average mixing tank.

block.uaw-crucible-alloy.name = Isostatic Crucible
block.uaw-crucible-alloy.description = A high-pressure metallurgical vessel. Subjects advanced compounds to multidirectional compression within a volatile atmosphere to synthesise hyper-dense industrial materials.
block.uaw-crucible-alloy.details = A Facility that fuses volatile reagents under extreme, multidirectional force to produces materials of unparalleled density at a rate considerably more expensive than anything ever conceived.
## endregion Production

## region Storage

block.uaw-depot-port.name = Depot Bus Port
block.uaw-depot-port.description = Central inventory node for a Depot Bus network. Items deposited into any connected Depot Bus Section are stored here. Unloaders placed adjacent to any Section draw from this inventory directly.
block.uaw-depot-port.details = Kilometres of belts, cables, pulleys, and elevators, folded into something that looks embarrassingly simple.

block.uaw-depot-section.name = Depot Bus Section
block.uaw-depot-section.description = Extends a Depot Bus network from an adjacent Bus Port or Bus Section. Must be placed adjacent to an existing Depot Bus Port or Section.
block.uaw-depot-section.details = Every gun ever fired, every shell ever loaded, every tank ever deployed are traceable. Follow the chain long enough and you'll find it back to one of these.

## endregion Storage

# endregion Facilities

# region Turrets

# Turrets - MG
block.uaw-quadra.name = Quadra
block.uaw-quadra.description = Twin-barrelled rapid-fire turret. Accelerates its rate of fire during sustained engagements.
block.uaw-quadra.details = Although this platform features only two barrels, its kinetic output mirrors a quad-linked array.
#block.uaw-quadra.copper.info = .303 INCH BALL \nStandard munition.
#block.uaw-quadra.graphite.info = .303 INCH HP \nMinor knockback, higher damage, but slower RoF.
#block.uaw-quadra.titanium.info = .303 INCH AP \nHigher velocity with armour piercing capability.
#block.uaw-quadra.silicon.info = .303 INCH GUIDED \nHas homing capability.

block.uaw-spitfire.name = Spitfire
block.uaw-spitfire.description = Oversized rotary cannon. Fires high-velocity munitions at an escalating rate against ground targets.
block.uaw-spitfire.details = Prolonged operation elevates internal temperatures until the assembly radiates a dull cherry-red spectrum. \n\nThe mechanical hum conveniently obscures the complaints of targeted hostiles.

block.uaw-saintfire.name = Saintfire
block.uaw-saintfire.description = Advanced suppression turret. Utilises Phlogiston-based coolant systems to sustain an extreme rate of fire.
block.uaw-saintfire.details = Unregulated thermodynamic friction liquefies standard mechanisms. Integrating Stoutsteel components prevents structural failure, while Phlogiston gases negate thermal buildup. The resulting muzzle flash generates a blinding, halo-like illumination, ensuring surviving targets experience profound reverence before expiration.

# Turrets - HA
block.uaw-solo.name = Solo
block.uaw-solo.description = Heavy long-range turret. Fires slow, high-damage kinetic projectiles at ground targets.
block.uaw-solo.details = Projectile mass and barrel length directly govern kinetic energy transfer. Ballistic platforms exploit this to maximise structural destruction at extreme ranges. The design trades rate-of-fire for singular impact stress. \n\nTargets rarely survive long enough to lodge formal complaints.
#block.uaw-solo.thorium.info = Reduced RoF. Higher Damage.

block.uaw-longsword.name = Longsword
block.uaw-longsword.description = Rapid-fire precision turret. Launches accurate, high-velocity munitions across vast distances.
block.uaw-longsword.details = Ancient metallurgical designs favoured elongated profiles to concentrate force into narrow puncture points. Scaling this structural configuration offers maximum aerodynamic stability. \n\nReceiving a high-velocity bolts closely mimics encountering an ancient bladed weapon moving at mach three.

block.uaw-excalibre.name = Excalibre
block.uaw-excalibre.description = Ultra-long-range anti-material turret. Utilises multi-stage acceleration to neutralise heavy units instantly.
block.uaw-excalibre.details = Hybrid electromagnetic and chemical propulsion systems eliminate traditional thermodynamic velocity ceilings. \n\nThough the installation is classified as fixed-gun infrastructure, most views the platform as a sovereign entity, given its automated ability to determine the sudden expiration of local hostiles.

# Turrets - SG
block.uaw-buckshot.name = Buckshot
block.uaw-buckshot.description = Short-range scatter turret. Expends multiple ballistic pellets simultaneously against nearby targets.
block.uaw-buckshot.details = Early area-denial doctrines favoured launching multiple unrefined projectiles from oversized, reinforced barrels. This archaic structural approach sacrifices accuracy for spatial saturation. \n\nDespite its crude appearance, it serves as a highly effective method for terminating localised disputes.

block.uaw-tempest.name = Tempest
block.uaw-tempest.description = Rapid-fire rotary shotgun. Discharges quick salvos of heavy slugs, prioritising aerial hostiles.
block.uaw-tempest.details = Combining multi-barrel rotary configurations with wide-dispersion munitions creates a continuous tunnel of shrapnel. Initial engineering assessments concluded that constructing a fully automatic rotary shot-cannon was fundamentally ill-conceived. The design naturally entered mass production immediately following this assessment.

block.uaw-ironduke.name = Iron Duke
block.uaw-ironduke.description = Heavy thermal shot-cannon. Unleashes short-range spreads of superheated compounds at a slow rate of fire.
block.uaw-ironduke.details = Dispersing ignited thermal compounds locally guarantees maximum kinetic transfer. This installation abandons rate-of-fire to launch massive volleys of superheated shrapnel. The exceptionally slow operational cycle affords adequate time to sweep up the resulting liquid slag.

