mod.uaw.name = Unlimited Armament Works
mod.uaw.author = Eschatologue

# region Consumables
## Items

item.uaw-sulphur.name = Sulphur
item.uaw-sulphur.description = By-product of carbon processing. Can be combined with water to produce Sulphuric Acid.
item.uaw-sulphur.detail = Often associated with the "brimstone" of ancient myth, its pungent aroma is a small price to pay for its industrial utility.

item.uaw-anthracite.name = Anthracite
item.uaw-anthracite.description = Used for fuel and material synthesising. Can be found deep beneath coal veins.
item.uaw-anthracite.detail = The highest rank of coal; it burns with a clean, blue flame and provides a significantly higher energy density than its softer counterparts.

item.uaw-h-anthracite.name = Heavy Anthracite
item.uaw-h-anthracite.description = A chemically refined Anthracite variant, processed with Sulphuric Acid to achieve near-total purity and extreme energy density.
item.uaw-h-anthracite.detail = By "pickling" Anthracite in acid to leach out remaining mineral impurities, the resulting product is so dense it burns with a distinct, piercing violet flame and intense, sustained heat.

item.uaw-tisic.name = TiSiC
item.uaw-tisic.description = A short for Titanium Silicon Carbide, it is an ultra-hard ceramic alloy. Used in constructions, fortifications, and armour-piercing munitions.
item.uaw-tisic.detail = Bridging the gap between metal and ceramic, Titanium Silicon Carbide is almost as hard as diamond yet none of its brittleness, making it the ideal substrate for high-velocity kinetic tools.

item.uaw-item-stoutsteel.name = Stoutsteel Alloy
item.uaw-item-stoutsteel.description = A phase-tempered refractory alloy. Absorbs extreme kinetic shocks and seals molecular fractures via spatial memory.
item.uaw-item-stoutsteel.details = "Stout by name, stout by nature." Synthesised via exotic spatial weaving, this material bypasses traditional physical limitations. The phase lattice retains a permanent memory of its original form, guaranteeing structural immortality and thoroughly frustrating any demolition attempts.

item.uaw-cryogel.name = Cryogel
item.uaw-cryogel.description = A cold, gelatinous substance. Used as cryogenic munitions and cooling agent.
item.uaw-cryogel.detail = It maintains a stable temperature of -200°C. Handling it without insulation is a mistake most only gets to make once.

liquid.uaw-sulphuric-acid.name = Sulphuric Acid
liquid.uaw-sulphuric-acid.description = A highly corrosive mineral acid. Vital for leaching ores and complex chemical manufacturing.
liquid.uaw-sulphuric-acid.detail = Once known as 'Oil of Vitriol', its discovery and eventual mass production heralded a new age of material engineering and industrial chemistry.

liquid.uaw-phlogiston.name = Phlogiston
liquid.uaw-phlogiston.description = Volatile and highly combustible gas, utilised to power Phlogiston-based infrastructures, as well as to synthesise advanced materials.
liquid.uaw-phlogiston.detail = Named after a debunked theory, this substance is ironically very real and very prone to exploding.

# endregion Consumables

# region Resourcing

block.uaw-hydro-thumper.name = Hydro Thumper
block.uaw-hydro-thumper.description = Injects high-pressure water deep beneath surface Coal veins, unearthing a highly potent Anthracite.\nMust be placed on Coal veins.
block.uaw-hydro-thumper.details = High-pressure water injection as a mining technique predates most of what surrounds it. The Hydro Thumper simply applies an old principle at a scale that would make its original engineers deeply uncomfortable.

block.uaw-acid-thumper.name = Acid Thumper
block.uaw-acid-thumper.description = Injects Sulphuric Acid deep beneath surface Copper veins, unearthing Covellite.\nMust be placed on Copper veins.
block.uaw-acid-thumper.details = Sulphuric acid has been used in industrial leaching and ore processing for millennia. Injecting it directly into a copper seam simply cuts out the intermediary steps.

# endregion Resourcing

# region Facilities

## region Production

# Production - Anthracite

block.uaw-attrition-mill.name = Attrition Mill
block.uaw-attrition-mill.description = Uses high-velocity abrasive friction with Sand to grind Graphite into Anthracite.
block.uaw-attrition-mill.details = Given enough velocity and a hard enough abrasive, almost any material can be ground into something more useful. Sand and graphite are not an obvious pairing, but the results are difficult to argue with.

# Production - Graphite

block.uaw-calcinator.name = Calcinator
block.uaw-calcinator.description = Subjects Anthracite to extreme heat to drive off impurities, leaving behind concentrated Graphite.\nProduces Sulphur as by-product.
block.uaw-calcinator.details = Calcination as a process predates most modern metallurgy. Ancient smelters used it to drive moisture and impurities from ore before it ever touched a furnace.

# Production - Sulphur

block.uaw-oxidation-kiln.name = Oxidation Kiln
block.uaw-oxidation-kiln.description = Subjects Lead and Coal to intense thermal oxidation to liberate elemental Sulphur.\nProduces Liquid Slag as a by-product.
block.uaw-oxidation-kiln.details = Thermal oxidation of sulphide-bearing ores to liberate elemental sulphur is a well-documented industrial process. The slag is an unavoidable consequence.

block.uaw-chemical-saturator.name = Chemical Saturator
block.uaw-chemical-saturator.description = Dissolves Sulphur into a water through sustained agitation, yielding Sulphuric Acid.
block.uaw-chemical-saturator.details = #n/a

# Production - Phlogiston

block.uaw-pyrolytic-extractor.name = Pyrolytic Extractor
block.uaw-pyrolytic-extractor.description = Subjects Oil, Anthracite and Sulphuric Acid to sustained thermal decomposition under controlled conditions, driving off volatile Phlogiston gas.
block.uaw-pyrolytic-extractor.details = Pyrolysis of carbon-bearing materials to extract combustible gases is not a new idea. What is new is doing it deliberately, consistently, and without losing the building in the process.

# Production - TiSiC

block.uaw-sintering-furnace.name = Sintering Furnace
block.uaw-sintering-furnace.description = Applies extreme heat and pressure to Titanium, Silicon, and Graphite, triggering a reactive consolidation that produces Titanium Silicon Carbide. \nOptionally uses Sulphuric Acid to boost yield.
block.uaw-sintering-furnace.details = Producing this alloy used to be a multistep ordeal; materials ground separately, surface oxides stripping, powders packed and pressed in sequence.\nThe Sintering Furnace consolidates every stage into a single continuous process. It is faster, cleaner, and considerably more expensive than anything it replaced.

# Production - Stoutsteel

block.uaw-isostatic-crucible.name = Isostatic Crucible
block.uaw-isostatic-crucible.description = A high-pressure metallurgical vessel. Fuses Titanium Silicon Carbide and Phase Fabric within a Phlogiston-sustained thermal environment to synthesise Stoutsteel Alloy.
block.uaw-isostatic-crucible.details = Isostatic pressing eliminates structural voids common in conventional forging. Suspending the components in a Phlogiston-saturated environment forces a flawless spatial weave. The internal pressure is guaranteed to instantly crush any operator foolish enough to unseal the viewing port.

## endregion Production

## region Storage

block.uaw-depot-port.name = Depot Bus Port
block.uaw-depot-port.description = Central inventory node for a Depot Bus network. Items deposited into any connected Depot Bus Section are stored here. Unloaders placed adjacent to any Section draw from this inventory directly.
block.uaw-depot-port.details = Kilometres of belts, cables, pulleys, and elevators, folded into something that looks embarrassingly simple.

block.uaw-depot-section.name = Depot Bus Section
block.uaw-depot-section.description = Extends a Depot Bus network from an adjacent Bus Port or Bus Section. Must be placed adjacent to an existing Depot Bus Port or Section.
block.uaw-depot-section.details = Every gun ever fired, every shell ever loaded, every tank ever deployed are traceable. Follow the chain long enough and you'll find it back to one of these.

## endregion Storage

# endregion Facilities

# region Turrets

# Turrets - MG
block.uaw-quadra.name = Quadra
block.uaw-quadra.description = Twin-barrelled rapid-fire turret. Accelerates its rate of fire during sustained engagements.
block.uaw-quadra.details = Structural nomenclature often diverges from physical reality to emphasise psychological impact. Although this platform features only two barrels, its kinetic output mirrors a quad-linked array.

block.uaw-spitfire.name = Spitfire
block.uaw-spitfire.description = Oversized rotary cannon. Expends high-velocity munitions at an escalating rate against ground targets.
block.uaw-spitfire.details = Rotary configurations distribute thermal stress across multiple barrels. Prolonged operation elevates internal temperatures until the assembly radiates a dull cherry-red spectrum. \n\nThe mechanical hum conveniently obscures the complaints of targeted hostiles.

block.uaw-saintfire.name = Saintfire
block.uaw-saintfire.description = Advanced suppression turret. Utilises Phlogiston-based coolant systems to sustain an extreme rate of fire.
block.uaw-saintfire.details = Unregulated thermodynamic friction liquefies standard mechanisms. Integrating Stoutsteel components prevents structural failure, while Phlogiston gases negate thermal buildup. The resulting muzzle flash generates a blinding, halo-like illumination, ensuring surviving targets experience profound reverence before expiration.

# Turrets - HA
block.uaw-solo.name = Solo
block.uaw-solo.description = Heavy long-range turret. Fires slow, high-damage kinetic projectiles at ground targets.
block.uaw-solo.details = Projectile mass and barrel length directly govern kinetic energy transfer. Ballistic platforms exploit this to maximise structural destruction at extreme ranges. The design trades rate-of-fire for singular impact stress. \n\nTargets rarely survive long enough to lodge formal complaints.

block.uaw-longsword.name = Longsword
block.uaw-longsword.description = Rapid-fire precision turret. Launches accurate, high-velocity munitions across vast distances.
block.uaw-longsword.details = Ancient metallurgical designs favoured elongated profiles to concentrate force into narrow puncture points. Scaling this structural configuration offers maximum aerodynamic stability. \n\nReceiving a high-velocity bolts closely mimics encountering an ancient bladed weapon moving at mach three.

block.uaw-excalibre.name = Excalibre
block.uaw-excalibre.description = Ultra-long-range anti-material turret. Utilises multi-stage acceleration to neutralise heavy units instantly.
block.uaw-excalibre.details = Hybrid electromagnetic and chemical propulsion systems eliminate traditional thermodynamic velocity ceilings. \n\nThough the installation is classified as fixed-gun infrastructure, most views the platform as a sovereign entity, given its automated ability to determine the sudden expiration of local hostiles.

# Turrets - SG
block.uaw-buckshot.name = Buckshot
block.uaw-buckshot.description = Short-range scatter turret. Expends multiple ballistic pellets simultaneously against nearby targets.
block.uaw-buckshot.details = Early area-denial doctrines favoured launching multiple unrefined projectiles from oversized, reinforced barrels. This archaic structural approach sacrifices accuracy for spatial saturation. \n\nDespite its crude appearance, it serves as a highly effective method for terminating localised disputes.

block.uaw-tempest.name = Tempest
block.uaw-tempest.description = Rapid-fire rotary shotgun. Discharges quick salvos of heavy slugs, prioritising aerial hostiles.
block.uaw-tempest.details = Combining multi-barrel rotary configurations with wide-dispersion munitions creates a continuous tunnel of shrapnel. Initial engineering assessments concluded that constructing a fully automatic rotary shot-cannon was fundamentally ill-conceived. The design naturally entered mass production immediately following this assessment.

block.uaw-ironduke.name = Iron Duke
block.uaw-ironduke.description = Heavy thermal shot-cannon. Unleashes short-range spreads of superheated compounds at a slow rate of fire.
block.uaw-ironduke.details = Dispersing ignited thermal compounds locally guarantees maximum kinetic transfer. This installation abandons rate-of-fire to launch massive volleys of superheated shrapnel. The exceptionally slow operational cycle affords adequate time to sweep up the resulting liquid slag.

