# region Consumables
## Items

item.uaw-sulphur.name = Sulphur
item.uaw-sulphur.description = By-product of carbon processing. Can be combined with water to produce Sulphuric Acid.
item.uaw-sulphur.detail = Often associated with the "brimstone" of ancient myth, its pungent aroma is a small price to pay for its industrial utility.

item.uaw-anthracite.name = Anthracite
item.uaw-anthracite.description = Used for fuel and material synthesising. Can be found deep beneath coal veins.
item.uaw-anthracite.detail = The highest rank of coal; it burns with a clean, blue flame and provides a significantly higher energy density than its softer counterparts.

item.uaw-h-anthracite.name = Heavy Anthracite
item.uaw-h-anthracite.description = A chemically refined Anthracite variant, processed with Sulphuric Acid to achieve near-total purity and extreme energy density.
item.uaw-h-anthracite.detail = By "pickling" Anthracite in acid to leach out remaining mineral impurities, the resulting product is so dense it burns with a distinct, piercing violet flame and intense, sustained heat.

item.uaw-tisic.name = Titanium Silicon Carbide
item.uaw-tisic.description = Ultra-hard ceramic alloy. Used in the construction of high-pressure vessels and heat-resistant plating.
item.uaw-tisic.detail = Bridging the gap between metal and ceramic, TiSiC is as hard as diamond yet none of its brittleness, making it the ideal substrate for high-velocity kinetic tools.

item.uaw-stoutsteel.name = Stoutsteel Alloy
item.uaw-stoutsteel.description = A reinforced industrial alloy engineered for maximum structural integrity and heavy-duty construction.
item.uaw-stoutsteel.detail = "Stout by name, stout by nature." Originally developed for deep-sea oil rigs, this Phlogiston-tempered alloy is the backbone of any structure meant to last centuries.

liquid.uaw-sulph-acid.name = Sulphuric Acid
liquid.uaw-sulph-acid.description = A highly corrosive mineral acid. Vital for leaching ores and complex chemical manufacturing.
liquid.uaw-sulph-acid.detail = Once known as 'Oil of Vitriol', its discovery and eventual mass production heralded a new age of material engineering and industrial chemistry.

liquid.uaw-phlogiston.name = Phlogiston
liquid.uaw-phlogiston.description = Volatile and highly combustible gas, utilised to power Phlogiston-based infrastructures, as well as to synthesise advanced materials
liquid.uaw-phlogiston.detail = Named after a debunked theory, this substance is ironically very real and very prone to exploding.

item.uaw-cryogel.name = Cryogel
item.uaw-cryogel.description = A cold, gelatinous substance. Used as thermal munitions and cooling agent.
item.uaw-cryogel.detail = It maintains a stable temperature of -200°C. Handling it without insulation is a mistake most only gets to make once.

# endregion Consumables

# region Resourcing

block.uaw-hydro-thumper.name = Hydro Thumper
block.uaw-hydro-thumper.description = Injects high-pressure water deep beneath surface Coal veins, unearthing a highly potent Anthracite. \n\Must be placed centred on Coal veins.

block.uaw-acid-thumper.name = Acid Thumper
block.uaw-acid-thumper.description = Injects Sulphuric Acid. deep beneath surface Coal veins, unearthing a highly potent Anthracite at greater efficiency \n\Must be placed centred on Coal veins
# endregion Resourcing

