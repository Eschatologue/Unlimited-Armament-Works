# region Facilities

block.uaw-calcinator.name = Calcinator
block.uaw-calcinator.description = Subjects Coal to extreme heat to drive off impurities, leaving behind concentrated Anthracite.\n\nProduces Sulphur as by-product.\n

block.uaw-oxidation-kiln.name = Oxidation Kiln
block.uaw-oxidation-kiln.description = Subjects Coal to extreme heat to drive off impurities, leaving behind concentrated Anthracite.\n\nProduces Sulphur as by-product.\n

block.uaw-attrition-mill.name = Attrition Mill
block.uaw-attrition-mill.description = Uses high-velocity abrasive friction with Sand to grind Graphite into Anthracite.


# endregion Facilities

