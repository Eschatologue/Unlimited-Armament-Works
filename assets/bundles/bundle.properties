mod.uaw.name = Unlimited Armament Works
mod.uaw.author = Eschatologue

# region Consumables
## Items
item.uaw-anthracite.name = Anthracite
item.uaw-anthracite.description = Used for fuel and material synthesising. Can be found deep beneath coal veins.
item.uaw-anthracite.details = The highest rank of coal; it provides a significantly higher energy density than its softer counterparts.

item.uaw-sulphur.name = Brimstone
item.uaw-sulphur.descripwtion = By-product of carbon and/or petrochemical processing. Can be combined with water to produce Brimstone Acid.
item.uaw-sulphur.details = Its pungent aroma is a small price to pay for its industrial utility.

item.uaw-thorium-enr.name = Thorium Monocarbide
item.uaw-thorium-enr.description = Metalic ceramic compound made via powder metallurgy. Used as armour piercing munitions and reactor fuel.
item.uaw-thorium-enr.details = Bridging the gap between metal and ceramic, Titanium Silicon Carbide is almost as hard as diamond yet none of its brittleness, making it the ideal substrate for high-velocity kinetic tools.

item.uaw-tisic.name = Titanium Silicon Carbide
item.uaw-tisic.description = Ultra-hard ceramic alloy made via powder metallurgy. Used in constructions and fortifications.
item.uaw-tisic.details = Bridging the gap between metal and ceramic, Titanium Silicon Carbide is almost as hard as diamond yet none of its brittleness, making it the ideal substrate for high-velocity kinetic tools.

item.uaw-stoutsteel.name = Stoutsteel
item.uaw-stoutsteel.description = A phase-tempered refractory alloy. Absorbs extreme kinetic shocks and can seal its own molecular fractures.
item.uaw-stoutsteel.details = Synthesised via exotic spatial weaving within a Phlogistic environment, this material bypasses traditional physical limitations. The phase lattice retains a permanent memory of its original form, guaranteeing structural immortality and thoroughly frustrating any demolition attempts.

item.uaw-ketonite.name = Ketonite
item.uaw-ketonite.description = High-density structural polymer. Utilised for construction.
item.uaw-ketonite.details = A semi-crystalline thermoplastic that boast immense structural and thermal resistance. Once a scarce commodity, it is now mass-produced and will (and did) outlast whoever the structure was built for.

item.uaw-cryo-solid.name = Cryothrate
item.uaw-cryo-solid.description = A synthetic cryogenic clathrate compound. Used as material synthesising and for manifacturing cryobaric munitions.
item.uaw-cryo-solid.details = Manufactured by crystallising refined petroleum compounds within a silica lattice under cryogenic conditions. The unstable structure stores hydrocarbons in a frozen metastable state. \nSudden collapse forces rapid phase transition, drawing thermal energy from surrounding materials. \n\nCold has finally learned industrial violence.

## Fluids
liquid.uaw-steam.name = Steam
liquid.uaw-steam.description = Gaseous state of water, produced by intense heating. Drives steam turbines and assists several industrial processes.
liquid.uaw-steam.details = Simplicity rarely goes out of fashion.

liquid.uaw-sulphuric-acid.name = Brimstone Acid
liquid.uaw-sulphuric-acid.description = A highly corrosive mineral acid. Vital for complex chemical manufacturing.
liquid.uaw-sulphuric-acid.details = Its discovery and eventual mass production heralded a new age of material engineering and industrial chemistry.

liquid.uaw-ref-oil.name = Refined Oil
liquid.uaw-ref-oil.description = A processed crude oil. Serves as a high-density combustible fuel and a primary reagent in advanced chemical synthesis.
liquid.uaw-ref-oil.details = Ancient civilisations routinely waged catastrophic wars over access to subterranean hydrocarbon reserves. Fractional distillation removes crude impurities to yield a versatile chemical foundation; which now fuels highly efficient catastrophic conflicts.

liquid.uaw-phlogiston.name = Phlogiston
liquid.uaw-phlogiston.description = Volatile, corrosive, and highly combustible gas, utilised for advanced power systems and material synthesis.
liquid.uaw-phlogiston.details = Named after a discarded theory of combustion, this engineered gas earned its name through enthusiasm for things that explode.

## Liquid (Solution)
liquid.uaw-liquid-titanium.name = Titanium Solution
liquid.uaw-liquid-titanium.description = Titanium dissolved in Brimstone Acid. Can be used to produce other materials.
liquid.uaw-liquid-titanium.details = #n/a

## Items - Munition
item.uaw-ammo-ball.name = Ball Munition
item.uaw-ammo-ball.description = Solid slug of common metal. Loads into a wide range of weaponry.
item.uaw-ammo-ball.details = A projectile that predates most other ammunition by a considerable margin.

item.uaw-ammo-ap.name = AP Munition
item.uaw-ammo-ap.description = Armour-Piercing. Hardened penetrator core.
item.uaw-ammo-ap.details = Armour and armour piercing race each other. This round leads, for now.

item.uaw-ammo-ap-i.name = API Munition
item.uaw-ammo-ap-i.description = Armour-Piercing Incendiary. Reduced-penetration core packed with ignition compound; sets targets alight on impact.
item.uaw-ammo-ap-i.details = Fire damage continues after the shooter has stopped paying attention.

item.uaw-ammo-ap-c.name = APC Munition
item.uaw-ammo-ap-c.description = Armour-Piercing Cryobaric. Reduced-penetration core packed with cryobaric compound; chills targets on impact.
item.uaw-ammo-ap-c.details = Metals grow brittle at low temperatures, a fact that improves every subsequent round.

item.uaw-ammo-he.name = HE Munition
item.uaw-ammo-he.description = High-Explosive. Projectile loaded with explosive compound. Detonates on impact for area damage.
item.uaw-ammo-he.details = Blast radius scales with the amount of filler and inversely with the enemy's confidence.

item.uaw-ammo-acg.name = ACG Munition
item.uaw-ammo-acg.description = Aero-Controlled Guidance. Onboard steering corrects its course towards targets in flight.
item.uaw-ammo-acg.details = Evasive manoeuvres by the target have become an exercise in optimism.

item.uaw-ammo-frag.name = FRAG Munition
item.uaw-ammo-frag.description = Fragmentation. Brittle-cased projectile. Shatters on impact into secondary fragments.
item.uaw-ammo-frag.details = FRONT. TOWARDS ENEMY

item.uaw-ammo-arc.name = ARC Munition
item.uaw-ammo-arc.description = Arc-Charged. Standard round charged to a super-critical state, discharging arcs of current on impact.
item.uaw-ammo-arc.details = Ohm's law raises no objection. It simply stops being consulted.

## Items - Shells

item.uaw-shell-gp.name = GP Shell
item.uaw-shell-gp.description = General-purpose shell with a basic explosive charge. Detonates on impact.
item.uaw-shell-gp.details = Adequate against most targets, which is the entire design brief.

item.uaw-shell-ap.name = AP Shell
item.uaw-shell-ap.description = Armour-Piercing. Solid shot with a hardened penetrator core. Carries no explosive charge.
item.uaw-shell-ap.details = Relies on momentum alone, which armour tends to find persuasive.

item.uaw-shell-he.name = HE Shell
item.uaw-shell-he.description = High-Explosive. Shell loaded with an improved explosive charge. Detonates on impact for area damage.
item.uaw-shell-he.details = Upgrading the filler improves the crater without changing the approach.

item.uaw-shell-he-vt.name = HE-VT Shell
item.uaw-shell-he-vt.description = High-Explosive Variable Time. Explosive shell with a proximity fuze. Bursts above the target, scattering miniature projectiles.
item.uaw-shell-he-vt.details = Bursting overhead removes any need for precision.

item.uaw-shell-he-i.name = HEI Shell
item.uaw-shell-he-i.description = High-Explosive Incendiary. HE shell loaded with additional ignition compound. Sets the impact area ablaze.
item.uaw-shell-he-i.details = Potent payload banned by an ancient convention.

item.uaw-shell-he-c.name = HEC Shell
item.uaw-shell-he-c.description = High-Explosive Cryobaric. HE shell loaded with additional cryobaric compound. Chills the impact area.
item.uaw-shell-he-c.details = Delivers winter to a specific grid reference.

item.uaw-shell-phl.name = X-PHL Shell
item.uaw-shell-phl.description = Experimental shell loaded with Phlogiston. Detonates repeatedly and violently, saturating the area with corrosive gas.
item.uaw-shell-phl.details = Explodes first, second, third, then corrodes afterwards. Nothing survives untreated.

## Items - Missile

item.uaw-missile-stdm.name = Standard Missile
item.uaw-missile-stdm.description = Standard universal missile loaded with adequate explosives.

item.uaw-missile-hism.name = High-Impact Standard Missile
item.uaw-missile-hism.description = Standard missiles packed with extra explosive charge. Slow travel speed and less range.

item.uaw-missile-hvsm.name = High-Velocity Standard Missile
item.uaw-missile-hvsm.description = Standard missiles packed with more fuel boosters and less explosive charge. Higher range.

# endregion Consumables

# region Resourcing

block.uaw-hydro-thumper.name = Hydro Thumper
block.uaw-hydro-thumper.description = Injects high-pressure water deep beneath surface Coal veins, unearthing a highly potent Anthracite.\nMust be placed on Coal veins.
block.uaw-hydro-thumper.details = An old principle automated at a scale that would make its original engineers deeply uncomfortable.

# endregion Resourcing

# region Facilities

## region Production I

block.uaw-boiler.name = Boiler
block.uaw-boiler.description = Converts Water to Steam. Efficiency varies by fuel or source.
block.uaw-boiler.details = This is not a water kettle. STOP pouring tea into it.

block.uaw-refiner-carbon.name = Calcinator
block.uaw-refiner-carbon.description = Performs high temperature and pressure of various carbon-based materials.
block.uaw-refiner-carbon.details = #n/a

block.uaw-refiner-oil.name = Petrochemical Refinery
block.uaw-refiner-oil.description = Cracks Oil or other materials into Refined Petroleum or other petroleum produce.
block.uaw-refiner-oil.details = The automated pressure valves emit an acoustic pitch known to induce severe nausea.

block.uaw-mixer-chem.name = Chemical Mixer
block.uaw-mixer-chem.description = Chemical mixing vessel. Combines reagents into various compounds. \n\nRecipes are automatically processed based on inputs.
block.uaw-mixer-chem.details = Mixing chemicals by hand was once considered an acceptable career risk. This unit automates the process, applying consistent proportions and timing regardless of operator temperament.

block.uaw-mixer-reactor.name = Reactor Crucible
block.uaw-mixer-reactor.description = Industrial reactor for conducting solid-, liquid-, and gas-phase chemical reactions under controlled conditions.\n\nRecipes are automatically processed based on inputs.
block.uaw-mixer-reactor.details = Reinforced reaction vessel for reactions that generally require more supervision than the average mixing tank.

block.uaw-furnace-adv.name = Sintering Press
block.uaw-furnace-adv.description = Uses extreme heat and intense hydraulic pressure to fuse raw powders into solid, high-performance materials.
block.uaw-furnace-adv.details = Consolidates all powder metallurgy processes into a single step, making it a considerably more expensive upgrade than everything it supposed to replace.

## endregion Production I

## region Storage

block.uaw-depot-port.name = Depot Bus Port
block.uaw-depot-port.description = Central inventory node for a Depot Bus network. Items deposited into any connected Depot Bus Section are stored here. Unloaders placed adjacent to any Section draw from this inventory directly.
block.uaw-depot-port.details = Kilometres of belts, cables, pulleys, and elevators, folded into something that looks embarrassingly simple.

block.uaw-depot-section.name = Depot Bus Section
block.uaw-depot-section.description = Extends a Depot Bus network from an adjacent Bus Port or Bus Section. Must be placed adjacent to an existing Depot Bus Port or Section.
block.uaw-depot-section.details = Every gun ever fired, every shell ever loaded, every tank ever deployed are traceable. Follow the chain long enough and you'll find it back to one of these.

## endregion Storage

## region Power

block.uaw-steam-turbine-mk1.name = Steam Turbine
block.uaw-steam-turbine-mk1.description = Steam-driven generator. Converts Steam into power and passes the remainder through its side, allowing turbines to chain.
block.uaw-steam-turbine-mk1.details = Coal furnaces, nuclear reactors and concentrated sunlight all share one final step: boiling water to spin a wheel. \n\nEvery power plant is, at heart, an elaborate kettle.

## endregion Power

# endregion Facilities

# region Turrets

# Turrets - MG
block.uaw-quadra.name = Quadra
block.uaw-quadra.description = Twin-barrelled rapid-fire turret. Slowly accelerates its rate of fire.
block.uaw-quadra.details = Although this platform features only two barrels, its kinetic output mirrors a quad-linked array.

block.uaw-spitfire.name = Spitfire
block.uaw-spitfire.description = Oversized rotary cannon. Slowly accelerates its rate of fire. Limited to ground targets.
block.uaw-spitfire.details = Prolonged operation elevates internal temperatures until the assembly radiates a dull cherry-red spectrum. \n\nThe mechanical hum conveniently obscures the complaints of targeted hostiles.

block.uaw-saintfire.name = Saintfire
block.uaw-saintfire.description = Advanced suppression turret. Utilises Phlogiston-based coolant systems to sustain an extreme rate of fire.
block.uaw-saintfire.details = Unregulated thermodynamic friction liquefies standard mechanisms. Integrating Stoutsteel components prevents structural failure, while Phlogiston gases negate thermal buildup. The resulting muzzle flash generates a blinding, halo-like illumination, ensuring surviving targets experience profound reverence before expiration.

# Turrets - HA
block.uaw-solo.name = Solo
block.uaw-solo.description = Heavy long-range turret. Fires slow, high-damage kinetic projectiles at ground targets.
block.uaw-solo.details = Projectile mass and barrel length directly govern kinetic energy transfer. Ballistic platforms exploit this to maximise structural destruction at extreme ranges. The design trades rate-of-fire for singular impact stress. \n\nTargets rarely survive long enough to lodge formal complaints.

block.uaw-longsword.name = Longsword
block.uaw-longsword.description = Rapid-fire precision turret. Launches accurate, high-velocity munitions across vast distances.
block.uaw-longsword.details = Ancient metallurgical designs favoured elongated profiles to concentrate force into narrow puncture points. Scaling this structural configuration offers maximum aerodynamic stability. \n\nReceiving a high-velocity bolts closely mimics encountering an ancient bladed weapon moving at mach three.

block.uaw-excalibre.name = Excalibre
block.uaw-excalibre.description = Ultra-long-range anti-material turret. Utilises multi-stage acceleration to neutralise heavy units instantly.
block.uaw-excalibre.details = Hybrid electromagnetic and chemical propulsion systems eliminate traditional thermodynamic velocity ceilings. \n\nThough it is classified as fixed-gun infrastructure, most views the platform as a sovereign entity, given its automated ability to determine the sudden expiration of local hostiles.

# Turrets - SG
block.uaw-buckshot.name = Buckshot
block.uaw-buckshot.description = Short-range scatter turret. Expends multiple ballistic pellets simultaneously against nearby targets.
block.uaw-buckshot.details = Early area-denial doctrines favoured launching multiple unrefined projectiles from oversized, reinforced barrels. This archaic structural approach sacrifices accuracy for spatial saturation. \n\nDespite its crude appearance, it serves as a highly effective method for terminating localised disputes.

block.uaw-tempest.name = Tempest
block.uaw-tempest.description = Rapid-fire rotary shotgun. Discharges quick salvos of heavy slugs, prioritising aerial hostiles.
block.uaw-tempest.details = Combining multi-barrel rotary configurations with wide-dispersion munitions creates a continuous tunnel of shrapnel. Initial engineering assessments concluded that constructing a fully automatic rotary shot-cannon was fundamentally ill-conceived. The design naturally entered mass production immediately following this assessment.

block.uaw-ironduke.name = Iron Duke
block.uaw-ironduke.description = Heavy thermal shot-cannon. Unleashes short-range spreads of superheated compounds at a slow rate of fire.
block.uaw-ironduke.details = Dispersing ignited thermal compounds locally guarantees maximum kinetic transfer. This installation abandons rate-of-fire to launch massive volleys of superheated shrapnel. The exceptionally slow operational cycle affords adequate time to sweep up the resulting liquid slag.

# Turrets - AF
