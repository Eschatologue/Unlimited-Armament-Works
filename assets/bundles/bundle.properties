mod.uaw.name = Unlimited Armament Works
mod.new-horizon.author = Eschatologue

# region Consumables
## Items

item.uaw-sulphur.name = Sulphur
item.uaw-sulphur.description = By-product of carbon processing. Can be combined with water to produce Sulphuric Acid.
item.uaw-sulphur.detail = Often associated with the "brimstone" of ancient myth, its pungent aroma is a small price to pay for its industrial utility.

item.uaw-anthracite.name = Anthracite
item.uaw-anthracite.description = Used for fuel and material synthesising. Can be found deep beneath coal veins.
item.uaw-anthracite.detail = The highest rank of coal; it burns with a clean, blue flame and provides a significantly higher energy density than its softer counterparts.

item.uaw-h-anthracite.name = Heavy Anthracite
item.uaw-h-anthracite.description = A chemically refined Anthracite variant, processed with Sulphuric Acid to achieve near-total purity and extreme energy density.
item.uaw-h-anthracite.detail = By "pickling" Anthracite in acid to leach out remaining mineral impurities, the resulting product is so dense it burns with a distinct, piercing violet flame and intense, sustained heat.

item.uaw-tisic.name = Titanium Silicon Carbide
item.uaw-tisic.description = Ultra-hard ceramic alloy. Used in the construction of high-pressure vessels and heat-resistant plating.
item.uaw-tisic.detail = Bridging the gap between metal and ceramic, TiSiC is as hard as diamond yet none of its brittleness, making it the ideal substrate for high-velocity kinetic tools.

item.uaw-stoutsteel.name = Stoutsteel Alloy
item.uaw-stoutsteel.description = A reinforced industrial alloy engineered for maximum structural integrity and heavy-duty construction.
item.uaw-stoutsteel.detail = "Stout by name, stout by nature." Originally developed for deep-sea oil rigs, this Phlogiston-tempered alloy is the backbone of any structure meant to last centuries.

item.uaw-cryogel.name = Cryogel
item.uaw-cryogel.description = A cold, gelatinous substance. Used as thermal munitions and cooling agent.
item.uaw-cryogel.detail = It maintains a stable temperature of -200°C. Handling it without insulation is a mistake most only gets to make once.

liquid.uaw-sulphuric-acid.name = Sulphuric Acid
liquid.uaw-sulphuric-acid.description = A highly corrosive mineral acid. Vital for leaching ores and complex chemical manufacturing.
liquid.uaw-sulphuric-acid.detail = Once known as 'Oil of Vitriol', its discovery and eventual mass production heralded a new age of material engineering and industrial chemistry.

liquid.uaw-phlogiston.name = Phlogiston
liquid.uaw-phlogiston.description = Volatile and highly combustible gas, utilised to power Phlogiston-based infrastructures, as well as to synthesise advanced materials
liquid.uaw-phlogiston.detail = Named after a debunked theory, this substance is ironically very real and very prone to exploding.

# endregion Consumables

# region Resourcing

block.uaw-hydro-thumper.name = Hydro Thumper
block.uaw-hydro-thumper.description = Injects high-pressure water deep beneath surface Coal veins, unearthing a highly potent Anthracite.\nMust be placed on Coal veins.\n
block.uaw-hydro-thumper.details = High-pressure water injection as a mining technique predates most of what surrounds it. The Hydro Thumper simply applies an old principle at a scale that would make its original engineers deeply uncomfortable.

block.uaw-acid-thumper.name = Acid Thumper
block.uaw-acid-thumper.description = Injects Sulphuric Acid deep beneath surface Copper veins, unearthing Covellite.\nMust be placed on Copper veins.\n
block.uaw-acid-thumper.details = Sulphuric acid has been used in industrial leaching and ore processing for millennia. Injecting it directly into a copper seam simply cuts out the intermediary steps.

# endregion Resourcing

# region Facilities

# Production - Anthracite

block.uaw-calcinator.name = Calcinator
block.uaw-calcinator.description = Subjects Coal to extreme heat to drive off impurities, leaving behind concentrated Anthracite.\n\nProduces Sulphur as by-product.\n
block.uaw-calcinator.details = Calcination as a process predates modern metallurgy by millennia ? ancient smelters used it to drive moisture and impurities from ore before it ever touched a furnace.

block.uaw-attrition-mill.name = Attrition Mill
block.uaw-attrition-mill.description = Uses high-velocity abrasive friction with Sand to grind Graphite into Anthracite.
block.uaw-attrition-mill.details = Given enough velocity and a hard enough abrasive, almost any material can be ground into something more useful. Sand and graphite are not an obvious pairing, but the results are difficult to argue with.

# Production - Sulphur

block.uaw-oxidation-kiln.name = Oxidation Kiln
block.uaw-oxidation-kiln.description = Subjects Lead and Coal to intense thermal oxidation to liberate elemental Sulphur.\n\nProduces Slag as a by-product.\n
block.uaw-oxidation-kiln.details = Thermal oxidation of sulphide-bearing ores to liberate elemental sulphur is a well-documented industrial process. The slag is an unavoidable consequence.

block.uaw-chemical-saturator.name = Chemical Saturator
block.uaw-chemical-saturator.description = Dissolves Sulphur into a water through sustained agitation, yielding Sulphuric Acid.\n
block.uaw-chemical-saturator.details = Every component in contact with the output is quietly losing the battle against it. Replacement seals, valves, and linings are considered consumables rather than exception, a cost factored into every production estimate.

# Production - Phlogiston

block.uaw-pyrolytic-extractor.name = Pyrolitic Extractor
block.uaw-pyrolytic-extractor.description = Subjects Oil and Anthracite to sustained thermal decomposition under controlled conditions, driving off volatile Phlogiston gas.\nOptionally uses Sulphuric Acid to boost efficiency\n
block.uaw-pyrolytic-extractor.details = Pyrolysis of carbon-bearing materials to extract combustible gases is not a new idea. What is new is doing it deliberately, consistently, and without losing the building in the process.

# Production - TiSiC

block.uaw-sintering-furnace.name = Sintering Furnace
block.uaw-sintering-furnace.description = Applies extreme heat and pressure to Titanium, Silicon, and Anthracite, triggering a reactive consolidation that produces Titanium Silicon Carbide.\nOptionally uses Sulphuric Acid to boost efficiency\n
block.uaw-sintering-furnace.details = In ancient times, producing this alloy was a multistep ordeal?materials ground separately, surface oxides stripping, powders packed and pressed in sequence. The Sintering Furnace consolidates every stage into a single continuous process. It is faster, cleaner, and considerably more expensive than anything it replaced.

# Production - Stoutsteel

block.uaw-isostatic-crucible.name = Isostatic Crucible
block.uaw-isostatic-crucible.description = Subjects Titanium Silicon Carbide and Anthracite to uniform high pressure within a Phlogiston-sustained thermal environment, producing Stoutsteel.\nOptionally uses Sulphuric Acid to boost efficiency\n
block.uaw-isostatic-crucible.details = Isostatic pressing eliminates the directional inconsistencies that plague conventional forging?pressure applied equally from all directions produces a material with no weak grain boundaries, no voids, no preferential failure points. Phlogiston's sustained thermal output makes the process viable at the scale required.

# endregion Facilities

